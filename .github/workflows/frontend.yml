name: Build Frontend Image

on:
  create:
    tags:
  workflow_call:
    inputs:
      push_image:
        description: 'Push image'
        required: false
        type: boolean
        default: false
      push_image_tag:
        description: 'Push image tag'
        default: 'latest'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image'
        required: false
        type: boolean
        default: false
      push_image_tag:
        description: 'Push image tag'
        default: 'latest'
        required: false
        type: string
  push:
    branches: ['main']
    paths:
      - 'frontend/desktop/**'
      - 'frontend/providers/**'
      - '.github/workflows/frontend.yml'
      - '!**/*.md'
      - '!**/*.yaml'
  pull_request:
    branches: ['*']
    paths:
      - 'frontend/desktop/**'
      - 'frontend/providers/**'
      - '.github/workflows/frontend.yml'
      - '!**/*.md'
      - '!**/*.yaml'

permissions:
  contents: read
  packages: write

env:
  # Common versions
  GO_VERSION: '1.20'
  DEFAULT_OWNER: 'labring'

jobs:
  image-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          [
            providers/devbox,
          ]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Expose git commit data
        uses: rlespinasse/git-commit-data-action@v1
      - name: Check if tag
        id: check_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "isTag=true" >> "$GITHUB_OUTPUT"
          else
            echo "isTag=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare
        id: prepare
        run: |
          bash ./scripts/resolve-tag-image.sh "${{ inputs.push_image }}" "${{ steps.check_tag.outputs.isTag }}"  "${{ inputs.push_image_tag }}"
      - name: Extract module name
        id: module_name
        run: |
          MODULE_NAME=$(basename ${{ matrix.module }})
          echo "MODULE_NAME=${MODULE_NAME}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sealos-${{ env.MODULE_NAME }}-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ steps.prepare.outputs.tag_name }},enable=true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Github Container Hub
        if: ${{ (github.event_name == 'push') ||(github.event_name == 'create') || (inputs.push_image == true) }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache pnpm-store
        uses: actions/cache@v3
        with:
          path: pnpm-store
          key: pnpm-store-${{ hashFiles('Dockerfile') }}
      - name: inject pnpm-store into docker
        uses: reproducible-containers/buildkit-cache-dance@v2.1.2
        with:
          cache-source: pnpm-store
      - name: Build And Push
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          build-args: |
            name=${{ env.MODULE_NAME }}
            path=${{ matrix.module }}
          # Push if it's a push event or if push_image is true
          push: ${{ (github.event_name == 'push') ||(github.event_name == 'create') || (inputs.push_image == true)  }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
